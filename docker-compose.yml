version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hunonic-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HUNONIC_PHONE=${HUNONIC_PHONE}
      - HUNONIC_PASSWORD=${HUNONIC_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://your-domain.com}
      - LOG_LEVEL=info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hunonic-network

  # Frontend (Nginx serving static files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: hunonic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - hunonic-network

  # Optional: PostgreSQL for data persistence/history
  # Uncomment if you want to store historical data
  # db:
  #   image: postgres:16-alpine
  #   container_name: hunonic-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=hunonic
  #     - POSTGRES_USER=hunonic
  #     - POSTGRES_PASSWORD=${DB_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - hunonic-network

  # Optional: Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: hunonic-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - hunonic-network

networks:
  hunonic-network:
    driver: bridge

